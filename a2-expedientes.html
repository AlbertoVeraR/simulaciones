<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Simulación con datos ficticios: cómo se consulta hoy un expediente en papel en un despacho de abogados y cuánto se ahorra con una carpeta compartida y, después, con un expediente digital con buscador con IA.">
<title>A2 · Expedientes digitales · Olmedo &amp; Vidal Abogados</title>
<style>
/* estilo.css: tablero luminoso común a todas las simulaciones (paneles blancos translúcidos, color por escenario). */
:root {
  --fondo: #eef2f7; --panel: rgba(255, 255, 255, .86); --tinta: #1f2a3d; --suave: #66728a; --linea: #e1e6ee;
  --rojo: #e5484d; --verde: #1fb57a; --sombra: 0 10px 30px rgba(31, 45, 80, .12), 0 1px 3px rgba(31, 45, 80, .07);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fondo); }
#app {
  --esc: #f2685a; position: fixed; inset: 0; overflow: hidden; background: var(--fondo); color: var(--tinta);
  font: 14px/1.4 -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
canvas.lienzo3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
canvas.lienzo3d:active { cursor: grabbing; }
.panel {
  background: var(--panel); border: 1px solid rgba(255, 255, 255, .75); box-shadow: var(--sombra); border-radius: 18px;
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
}

/* ---------- Barra superior ---------- */
.barra { position: absolute; top: 12px; left: 12px; right: 12px; height: 62px; z-index: 6; padding: 0 12px 0 12px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; grid-template-areas: "marca esc vista derecha"; align-items: center; gap: 14px; }
.marca { grid-area: marca; display: flex; align-items: center; gap: 11px; min-width: 0; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, #22c55e, #15924a); color: #fff; display: grid; place-items: center;
  font-weight: 900; font-size: 22px; box-shadow: 0 5px 14px rgba(22, 163, 74, .35); flex: none; }
.titulos { min-width: 0; }
.titulos b { display: block; font-size: 15px; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titulos small { display: block; color: var(--suave); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.escenarios { grid-area: esc; display: flex; gap: 3px; background: rgba(31, 42, 61, .055); padding: 4px; border-radius: 14px; }
.escenarios button { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 650; font-size: 13px; color: var(--suave);
  display: flex; align-items: center; gap: 7px; cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
.escenarios button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.escenarios button:hover { color: var(--tinta); }
.escenarios button.activo { background: #fff; color: var(--tinta); box-shadow: 0 2px 8px rgba(31, 45, 80, .13); }
.escenarios button.activo i { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent); }
.interruptor { grid-area: vista; position: relative; display: flex; background: rgba(31, 42, 61, .055); border-radius: 14px; padding: 4px; }
.interruptor button { position: relative; z-index: 1; border: 0; background: transparent; width: 106px; padding: 8px 0; display: flex; align-items: center;
  justify-content: center; gap: 6px; font-weight: 650; font-size: 13px; color: var(--suave); cursor: pointer; transition: color .25s; }
.interruptor button.activo { color: var(--tinta); }
.interruptor .bola { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 106px; background: #fff; border-radius: 10px;
  box-shadow: 0 2px 8px rgba(31, 45, 80, .13); transition: transform .4s cubic-bezier(.35, 1.35, .5, 1); }
.interruptor.en-monitor .bola { transform: translateX(106px); }
.derecha { grid-area: derecha; display: flex; align-items: center; gap: 10px; }
.vivo { display: flex; align-items: center; gap: 7px; background: #e8f7ef; color: #13895a; font-weight: 750; font-size: 13px; padding: 8px 11px; border-radius: 12px;
  font-variant-numeric: tabular-nums; }
.vivo i { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); animation: latido 1.6s infinite; }
.b-preguntas { border: 0; background: var(--tinta); color: #fff; border-radius: 12px; padding: 9px 13px; display: flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13px; cursor: pointer; }
.b-preguntas[hidden] { display: none; }
.b-preguntas:hover { background: #2c3a54; }
.b-supuestos { border: 0; background: var(--tinta); color: #fff; border-radius: 12px; padding: 9px 13px; display: flex; align-items: center; gap: 7px;
  font-weight: 650; font-size: 13px; cursor: pointer; }
.b-supuestos:hover { background: #2c3a54; }

/* ---------- Tarjetas de indicadores ---------- */
.tarjetas { position: absolute; top: 86px; left: 12px; right: 356px; display: flex; gap: 10px; z-index: 5; }
.tarjeta { position: relative; flex: 1 1 0; min-width: 0; display: flex; gap: 10px; align-items: center; padding: 12px 12px 11px; border-radius: 16px;
  background: var(--panel); border: 1px solid rgba(255, 255, 255, .75); box-shadow: var(--sombra); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.tarjeta .ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--esc) 13%, #fff); color: var(--esc); transition: background .3s, color .3s; }
.tarjeta > div { min-width: 0; }
.tarjeta small { display: block; font-size: 11.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tarjeta b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tarjeta em { display: block; font-style: normal; font-size: 11.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tarjeta em.bien { color: #13895a; }
.tarjeta em.mal { color: #c93a40; }
.tarjeta p { margin: 0; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.tarjeta .estim { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #8f9ab0; background: #eef1f5; padding: 2px 5px; border-radius: 6px; white-space: nowrap; }

/* ---------- Panel del paso ---------- */
.panel-paso { position: absolute; top: 86px; right: 12px; width: 332px; max-height: calc(100% - 86px - 214px); overflow: auto; padding: 16px 18px; z-index: 5; }
.pp-cab { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--suave); }
.pp-num { font-weight: 700; }
.pp-modo { font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #eef1f5; color: #5f6b80; }
.pp-modo.manual { background: color-mix(in srgb, var(--esc) 14%, #fff); color: color-mix(in srgb, var(--esc) 75%, #1f2a3d); }
.pp-modo.auto { background: #e1f6ec; color: #13895a; }
.pp-modo.revisar { background: #e4ecfd; color: #2f63d6; }
.pp-hora { margin-left: auto; font-weight: 750; color: var(--tinta); font-variant-numeric: tabular-nums; }
.panel-paso h3 { margin: 8px 0 8px; font-size: 18px; letter-spacing: -.015em; line-height: 1.25; }
.pp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pp-chips span { display: inline-flex; align-items: center; gap: 5px; background: #f1f4f8; border-radius: 999px; padding: 4px 9px 4px 7px; font-size: 12px; font-weight: 600; color: #46526a; }
.pp-chips svg { width: 14px; height: 14px; }
.panel-paso p { margin: 10px 0 0; color: #3d4860; font-size: 13.5px; }
.pp-marcas { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pp-marcas li { border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 650; }
.pp-marcas li.dolor { background: #fff1f0; color: #c93a40; }
.pp-marcas li.mejora { background: #e9f8f0; color: #13895a; }
.pp-personas { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pp-personas small { width: 100%; color: var(--suave); font-size: 11.5px; }
.chip-persona { border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12px; font-weight: 650; display: inline-flex;
  align-items: center; gap: 4px; cursor: pointer; }
.chip-persona:hover { border-color: var(--esc); }
.chip-persona svg { width: 14px; height: 14px; }

/* ---------- Zoom ---------- */
.zoom { position: absolute; right: 358px; top: 178px; display: flex; flex-direction: column; padding: 4px; gap: 2px; z-index: 5; border-radius: 14px; }
.zoom button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; color: #46526a; }
.zoom button:hover { background: #f1f4f8; }

/* ---------- Pie: línea de pasos y controles ---------- */
.pie { position: absolute; left: 12px; right: 12px; bottom: 30px; display: flex; gap: 12px; z-index: 5; align-items: stretch; }
.linea-panel { flex: 1; min-width: 0; padding: 12px 18px 14px; }
.linea-panel .cab { display: flex; align-items: baseline; gap: 10px; }
.linea-panel .cab b { font-size: 14px; }
.esc-nombre { font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linea { list-style: none; margin: 12px 0 0; padding: 0; display: flex; }
.linea li { flex: 1 1 0; min-width: 0; position: relative; text-align: center; cursor: pointer; padding: 0 5px; }
.linea li::before { content: ''; position: absolute; top: 17px; left: -50%; right: 50%; height: 3px; background: var(--linea); border-radius: 2px; }
.linea li:first-child::before { display: none; }
.linea li.hecho::before, .linea li.actual::before { background: var(--esc); }
.linea .bola { position: relative; z-index: 1; width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center;
  background: #fff; border: 2px solid #dbe1ea; color: var(--suave); transition: background .3s, border-color .3s, color .3s; }
.linea .bola b { font-size: 14px; }
.linea li.hecho .bola { background: var(--esc); border-color: var(--esc); color: #fff; }
.linea li.actual .bola { border-color: var(--esc); color: var(--esc); box-shadow: 0 0 0 6px color-mix(in srgb, var(--esc) 18%, transparent); }
.linea .m { position: absolute; top: -7px; right: -9px; width: 19px; height: 19px; border-radius: 50%; font-size: 11px; font-weight: 800; display: grid;
  place-items: center; font-style: normal; color: #fff; border: 2px solid #fff; }
.linea .m.dolor { background: var(--rojo); }
.linea .m.mejora { background: var(--verde); }
.linea .m.igual { background: #a9b1bc; }
.linea-panel .leyenda { display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 12px; color: var(--suave); white-space: nowrap; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda .m { width: 19px; height: 19px; border-radius: 50%; font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; font-style: normal; color: #fff; }
.leyenda .m.dolor { background: var(--rojo); }
.leyenda .m.mejora { background: var(--verde); }
.leyenda .m.igual { background: #a9b1bc; }
.linea strong { display: block; font-size: 12px; line-height: 1.25; font-weight: 650; color: #3d4860; }
.linea li.actual strong { color: var(--tinta); }
.linea small { display: block; font-size: 11px; color: var(--suave); margin-top: 2px; font-variant-numeric: tabular-nums; }
.control-panel { width: 332px; flex: none; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; align-content: center; }
.botones { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.botones button { width: 40px; height: 40px; border: 0; border-radius: 12px; background: #f1f4f8; display: grid; place-items: center; cursor: pointer; }
.botones button svg { fill: currentColor; stroke: none; }
.botones button:hover { background: #e7ebf1; }
.botones .prin { width: 52px; background: var(--esc); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--esc) 40%, transparent); }
.botones .prin:hover { background: var(--esc); filter: brightness(1.05); }
.botones .b-vel { width: auto; padding: 0 12px; font-weight: 750; font-size: 13px; margin-left: auto; }
.reloj, .minutos { display: flex; flex-direction: column; background: #f6f8fb; border-radius: 12px; padding: 7px 10px; }
.reloj .hora, .minutos b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
.minutos b { font-size: 17px; line-height: 1.4; }
.reloj small, .minutos small { font-size: 11px; color: var(--suave); }
.unidad { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; border-top: 1px solid var(--linea); padding-top: 9px; }
.unidad small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); font-weight: 700; }
.unidad b { font-size: 12.5px; }
.u-estado { margin-left: auto; font-size: 12px; font-weight: 750; padding: 3px 9px; border-radius: 999px; background: #eef1f5; color: #5f6b80; }
.u-estado:empty { display: none; }
.u-estado.dolor { background: #fff1f0; color: #c93a40; }
.u-estado.mejora { background: #e1f6ec; color: #13895a; }
.nota-datos { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11.5px; color: #7d889c; z-index: 5; pointer-events: none; }

/* ---------- Bocadillos y marcas sobre la escena ---------- */
.capa { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.capa-monitor { display: none; }
.vista-monitor .capa-monitor { display: block; }
.vista-monitor .capa-textos { display: none; }
.txt { position: absolute; left: 0; top: 0; will-change: transform; max-width: 250px; font-size: 13px; line-height: 1.3; animation: aparecer .28s ease-out; }
.txt.bocadillo { background: #fff; color: var(--tinta); padding: 8px 12px; border-radius: 14px; box-shadow: var(--sombra); font-weight: 650; margin-top: -8px; }
.txt.bocadillo::after, .txt.mensaje::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
.txt.mensaje { background: #dcf8c6; color: #1f2a3d; padding: 8px 12px 9px; border-radius: 14px; box-shadow: var(--sombra); font-weight: 600; max-width: 290px; margin-top: -8px; }
.txt.mensaje::after { border-top-color: #dcf8c6; }
.txt.mensaje small { display: block; font-size: 10.5px; font-weight: 800; color: #128c7e; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.txt.dolor, .txt.mejora { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px 4px 4px; font-weight: 750; font-size: 12.5px; white-space: nowrap;
  box-shadow: var(--sombra); }
.txt.dolor { background: #fff1f0; color: #c93a40; border: 1px solid #f7caca; }
.txt.mejora { background: #ebf9f2; color: #13895a; border: 1px solid #bfe9d4; }
.txt i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: #fff; font-size: 12px; flex: none; }
.txt.dolor i { background: var(--rojo); }
.txt.mejora i { background: var(--verde); }
.txt.sistema { background: #1f2a3d; color: #fff; padding: 7px 11px; border-radius: 12px; font-weight: 650; font-size: 12.5px; box-shadow: var(--sombra); margin-top: -8px; }

/* ---------- Etiquetas del monitor ---------- */
.mod { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; background: #fff; border-radius: 14px; padding: 6px 11px 7px; box-shadow: var(--sombra);
  font-size: 12.5px; font-weight: 700; line-height: 1.2; text-align: center; max-width: var(--mw, 190px); display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: box-shadow .25s; will-change: transform; }
.mod:hover { box-shadow: 0 0 0 2px #c9d3e2, var(--sombra); }
.mod.activo { box-shadow: 0 0 0 3px var(--esc), var(--sombra); }
.mod.quitado .mod-nombre { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--rojo); color: #8c97aa; }
.tag-nuevo { position: absolute; top: -9px; right: -7px; font-style: normal; background: var(--esc); color: #fff; font-size: 9.5px; font-weight: 800; letter-spacing: .07em; padding: 2px 7px; border-radius: 999px;
  box-shadow: 0 0 12px color-mix(in srgb, var(--esc) 60%, transparent); animation: brillo 1.8s infinite; }
.tag-quitado { font-style: normal; background: #fde9e9; color: #c93a40; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.mod-chip { font-style: normal; font-size: 12px; font-weight: 750; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }   /* va dentro de la etiqueta: no tapa la pantalla */
.mod-chip:empty { display: none; }
.mod-chip.dolor { background: #fff1f0; color: #c93a40; }
.mod-chip.mejora { background: #ebf9f2; color: #13895a; }

/* ---------- Mensaje de paso, ficha de persona y fundido ---------- */
.toast { position: absolute; top: 196px; left: calc((100% - 344px) / 2); transform: translate(-50%, -10px); z-index: 7; pointer-events: none; opacity: 0;
  background: rgba(31, 42, 61, .9); color: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 650; font-size: 14px; white-space: nowrap; box-shadow: var(--sombra); }
.toast b { background: rgba(255, 255, 255, .16); padding: 2px 8px; border-radius: 999px; margin-right: 9px; font-variant-numeric: tabular-nums; }
.toast.ver { animation: toast 2.6s ease both; }
.ficha-persona { position: absolute; z-index: 8; padding: 11px 14px; width: 250px; }
.ficha-persona[hidden] { display: none; }
.ficha-persona b { display: block; font-size: 15px; }
.ficha-persona small { color: var(--suave); font-size: 12px; }
.ficha-persona p { margin: 7px 0 0; font-size: 13px; }
.ficha-persona p span { font-weight: 750; color: var(--esc); }
.fundido { position: absolute; inset: 0; background: #f7f9fc; opacity: 0; visibility: hidden; z-index: 3; pointer-events: none; }
.error3d { position: absolute; inset: 40% 10% auto; z-index: 30; background: #fff; border-radius: 16px; padding: 18px; text-align: center; box-shadow: var(--sombra); }

/* ---------- Ventanas (módulo y supuestos) ---------- */
.modal { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; }
.modal[hidden] { display: none; }
.modal .fondo { position: absolute; inset: 0; background: rgba(31, 42, 61, .3); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.modal-card { position: relative; background: #fff; border-radius: 22px; box-shadow: 0 30px 80px rgba(20, 30, 60, .3); padding: 22px 24px 20px; width: min(720px, calc(100% - 24px));
  max-height: calc(100% - 32px); overflow: auto; animation: subir .3s ease-out; }
.modal-card h3 { margin: 2px 0 14px; font-size: 20px; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.modal-card .sobre { color: var(--suave); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
.modal-card .sub { margin: -6px 0 14px; color: var(--suave); }
.modal-card .cerrar { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #f1f4f8; font-size: 20px; cursor: pointer; }
.mm-pantalla { display: flex; justify-content: center; background: linear-gradient(160deg, #eef2f8, #e3e9f2); border-radius: 16px; padding: 18px; }
.mm-nota { margin: 12px 0 0; color: #3d4860; font-size: 13.5px; }
.sup-campos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.modal-supuestos label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 650; color: #46526a; }
.modal-supuestos input { border: 1px solid #d9e0ea; border-radius: 10px; padding: 9px 10px; font: 700 16px/1 inherit; color: var(--tinta); width: 100%; background: #f9fafc; }
.modal-supuestos input:focus { outline: 2px solid var(--esc); border-color: transparent; background: #fff; }
.modal-supuestos fieldset { border: 1px solid var(--linea); border-radius: 14px; margin: 14px 0 0; padding: 10px 12px 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.modal-supuestos legend { font-size: 12.5px; font-weight: 700; color: #46526a; padding: 0 6px; }
.sup-tabla { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
.sup-tabla th { text-align: left; font-size: 11.5px; color: var(--suave); font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--linea); }
.sup-tabla td { padding: 8px; border-bottom: 1px solid #f0f2f6; font-weight: 650; }
.sup-tabla td i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
.formulas { font-size: 12px; color: var(--suave); margin: 12px 0 0; }
.modal-card .cerrar.rojo { background: #fdecea; color: #d64545; }

<script>
/* motor/kit.js */
// kit.js: piezas, materiales, texturas y escena base luminosa del motor de simulaciones.
// Three.js r128 en script clásico (sin compilar). Adaptado del kit del monitor de flujos de A&V.
(function (g) {
  'use strict';
  const T = g.THREE;
  const SIM = g.SIM = g.SIM || {};

    blanco: '#ffffff', hueso: '#f6f7fa', niebla: '#eef2f7', perla: '#e6ebf2', gris: '#cdd5df', grisMedio: '#9aa6b6',
    grisOsc: '#5d6878', tinta: '#1f2a3d', azul: '#3b6df0', azulSuave: '#dce6ff', cielo: '#eaf1fb',

  // ---------- Materiales ----------
  // Los materiales sin opciones se comparten por color: así las mallas estáticas se pueden fusionar.
  const cacheMat = {};

    if (!k) return crear();
    if (!cacheMat[k]) { cacheMat[k] = crear(); cacheMat[k].userData.compartido = true; }

  }
  // Mate suave: paredes, muebles, ropa.
  function mat(color, o) {
    return cacheado(o ? null : 'm' + color, () => new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0, envMapIntensity: 0.28 }, o)));
  }
  // Plástico pulido: aparatos, pantallas, piezas del monitor.
  function brillo(color, o) {
    return cacheado(o ? null : 'b' + color, () => new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.32, metalness: 0, envMapIntensity: 0.55 }, o)));
  }
  function metal(color, o) {
    return cacheado(o ? null : 'k' + color, () => new T.MeshStandardMaterial(Object.assign({ color: color || '#b9c2cf', metalness: 0.5, roughness: 0.32, envMapIntensity: 0.7 }, o)));
  }
  // Material que brilla solo (luces, cruz verde, LEDs). No se comparte: se anima.
  function luz(color, intensidad) {
    return new T.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensidad == null ? 1 : intensidad, roughness: 0.4 });
  }
  function vidrio(color, opacidad) {

/* motor/mundo.js */

<script>
/* motor/monitor.js */
// monitor.js: vista Monitor. Los módulos del flujo en 3D, unidos por tubos por los que viaja la unidad de trabajo
// (el encargo, la demanda, la llamada...). Los módulos nuevos brillan con «NUEVO»; los que sobran salen tachados; los opcionales (opcional: true) llevan «OPCIONAL» en gris, sin brillo.
// Cada escenario del guion trae: modulos [{ id, nombre, tipo, col, fila, nuevo, opcional, probar (etiqueta «POR PROBAR»), quitado, pantalla, nota }],
// tubos [['a', 'b'], ['c', 'd', 'arco']] y en cada paso monitor: { ruta: [...], senales: [[a, b]], pantallas: { id: pantalla } }.
// Junto a cada módulo donde se trabaja a mano (pasos modo 'manual'; paso.monitor.manual: [ids] o, si falta, el último de la ruta) se ve una
// persona pequeña con bata (guion.trabajadora: id del personaje; por defecto el primero); en los automáticos no hay nadie.
// Las pantallas son grandes, están levantadas e inclinadas hacia la cámara; los arcos pasan por delante del módulo de en medio.
(function (g) {
  'use strict';
  const T = g.THREE, SIM = g.SIM, K = SIM.K;

  // Ficha que viaja: tarjeta blanca con banda del color del escenario y el nombre de la unidad (p. ej. «Encargo · Sr. Ramírez»).

        c.fillStyle = color; K.rr(c, 0, 0, w, 78, 22); c.fill(); c.fillRect(0, 50, w, 28);
        c.fillStyle = '#ffffff'; c.font = '800 38px ' + K.FUENTE; c.textBaseline = 'middle'; c.fillText((U.titulo || 'Unidad').toUpperCase(), 24, 42);
        const d = String(U.detalle || '').split(' · ');

        c.fillStyle = '#5f6b80'; c.font = '600 30px ' + K.FUENTE; c.fillText(d[1] || '', 24, 184);
      });
    } };
    return gr;
  }

  // ---------- Piezas de cada módulo (según su tipo) ----------
  // Las pantallas son grandes, están levantadas del puesto e inclinadas hacia la cámara para que se lea lo que muestran.
  function lienzoDe(spec, ancho, alto, zoom) {
    const l = K.lienzo(640, Math.round(640 * alto / ancho));

  const POSE = { pantalla: 'teclear', telefono: 'telefono', impresora: 'hablar', movil: 'movil', nodo: 'teclear' };
  const PIEZAS = {
    // Ordenador: pantalla grande sobre un pie y teclado delante.
    pantalla(gr, def) {
      const claro = K.brillo('#e9edf3');
      K.en(gr, K.caja(0.9, 0.07, 0.6, 0.035, claro), 0, 0.035, -0.62);
      K.en(gr, K.cilindro(0.08, 1.2, claro, 12), 0, 0.6, -0.68);

<script>
/* A2-expedientes/escena.js */
// A2-expedientes/escena.js: el mundo del caso A2, el mismo despacho «Olmedo & Vidal Abogados» de A1 a escala humana (1 unidad = 1 metro).
// Cambia con el escenario: Actual (repisas llenas y cajas en el suelo), Mejorado (escáner con alimentador) y Óptimo (huecos y cajas rotuladas).
// Calle con banco; despacho del socio (mesa con ordenador, silla del cliente, estantería de expedientes en papel, copiadora)
// y, al otro lado de una puerta, la oficina separada de la abogada externa. Todo ficticio.
// Coordenadas: x hacia la derecha, z hacia la calle, y hacia arriba.
SIM.escena = function (K, M) {
  'use strict';
  const T = K.THREE, E = M.estatico, H = 2.9, G = 0.14;

  // ---------- Materiales y texturas ----------
  const textura = (w, h, rep, pintar) => { const l = K.lienzo(w, h, pintar); l.tex.wrapS = l.tex.wrapT = T.RepeatWrapping; l.tex.repeat.set(rep[0], rep[1]); return l.tex; };
  const suelo = (map) => new T.MeshStandardMaterial({ map, color: '#ffffff', roughness: 0.7, envMapIntensity: 0.25 });
  const parquet = (base, junta) => (c, w, h) => { c.fillStyle = base; c.fillRect(0, 0, w, h); c.fillStyle = junta; for (let y = 0; y < h; y += 32) { c.fillRect(0, y, w, 2); c.fillRect(((y / 32) % 2) * 64, y, 2, 32); } };
  const baldosa = (base, junta) => (c, w, h) => { c.fillStyle = base; c.fillRect(0, 0, w, h); c.fillStyle = junta; c.fillRect(0, 0, w, 3); c.fillRect(0, 0, 3, h); };
  const mDespacho = suelo(textura(128, 128, [10, 9], parquet('#dcc19c', '#c9aa80')));
  const mOficina = suelo(textura(128, 128, [7, 9], parquet('#e4d3b8', '#d2bd9c')));
  const mAcera = suelo(textura(64, 64, [80, 7], baldosa('#e4e6ea', '#cfd3da')));
  const mAsfalto = K.mat('#c3c9d2'), mBordillo = K.mat('#c2c9d3'), mCesped = K.mat('#d4ebc9'), mBlanco = K.mat('#ffffff');
  const mPared = K.mat('#f6f5f2'), mExterior = K.mat('#eee9e1'), mZocalo = K.mat('#e3e7ee'), mMarino = K.mat('#1f2f56'), mDorado = K.mat('#c9a24a');
  const mMadera = K.mat('#c79a68'), mMaderaOsc = K.mat('#8f6a45'), mGris = K.mat('#cfd6df'), mGrisOsc = K.brillo('#3a4252'), mMetal = K.metal('#c4cbd5');

  plano(140, 140, K.mat('#e9edf2'), 0, -0.03, 0);
  plano(9.6, 9, mDespacho, -1.2, 0.005, -0.5);                    // despacho del socio
  plano(6.8, 9, mOficina, 7.0, 0.005, -0.5);                      // oficina de la abogada externa
  plano(46, 2.6, mAcera, 2, 0.004, 5.3);
  plano(46, 3.6, mAsfalto, 2, 0.0, 8.4);
  plano(46, 3.3, mAcera, 2, 0.004, 11.85);
  plano(46, 3.5, mCesped, 2, 0.003, 15.2);
  [6.6, 10.2].forEach(z => K.en(E, K.bloque(46, 0.05, 0.18, mBordillo), 2, 0.025, z));
  for (let x = -19; x < 24; x += 3) K.en(E, K.bloque(1.6, 0.012, 0.14, mBlanco), x, 0.008, 8.4);
  for (let x = -4.1; x <= -2.4; x += 0.42) K.en(E, K.bloque(0.26, 0.012, 3.3, mBlanco), x, 0.009, 8.4);
  K.en(E, K.placa(1.9, 1.1, 0.02, 0.12, K.mat('#9aa4b2')), -3, 0, 3.4);   // felpudo de la entrada

  // ---------- Paredes (se bajan solas cuando tapan lo que mira la cámara) ----------
  function pared(x1, z1, x2, z2, o) {
    o = o || {};

  K.en(E, K.bloque(0.08, 2.2, 0.08, mMaderaOsc), 3.6, 1.1, -3.04); K.en(E, K.bloque(0.08, 2.2, 0.08, mMaderaOsc), 3.6, 1.1, -0.96);

  // Fachada: zócalo, escaparates, banda azul marino con el letrero y puerta automática del despacho.
  const fachada = new T.Group();
  [[-6, -3.95], [-2.05, 3.6], [3.6, 8.45], [9.55, 10.4]].forEach(([a, b]) => {
    K.en(fachada, K.bloque(b - a, 0.5, 0.2, K.mat('#e2ddd5')), (a + b) / 2, 0.25, 4);
    K.en(fachada, new T.Mesh(new T.PlaneGeometry(b - a, 1.85), mCristal), (a + b) / 2, 1.43, 4.02);
  });
  K.en(fachada, K.bloque(16.6, 0.6, 0.22, mMarino), 2.2, 2.6, 4.02);
